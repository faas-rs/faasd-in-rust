[package]
name = "faas-containerd"
version = "0.1.0"
edition = "2024"

[dependencies]
http = "1"
bollard = "0.18"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15.0"
sled = "0.34.7"
gateway = { path = "../gateway" }

[dev-dependencies]
tower = "0.5"
